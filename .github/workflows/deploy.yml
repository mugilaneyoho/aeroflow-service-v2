name: Deploy Aeroflow

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |

            cd /home/ubuntu/aeroflow-service-v2

            if [ ! -d "aeroflow-service-v2" ]; then
              git clone https://github.com/mugilaneyoho/aeroflow-service-v2.git
            fi

            cd aeroflow-service-v2

            git fetch origin

            git reset --hard origin/main

            docker compose down

            docker compose build

            docker compose up -d

            docker image prune -f
