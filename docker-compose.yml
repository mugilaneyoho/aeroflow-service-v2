  # ---------------- DATABASES ---------------- #
  patron:
    image: postgres:16
    container_name: patron
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - patron_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network

  # ---------------- INFRA ---------------- #

  redis:
   image: redis:latest
   container_name: redis
   restart: unless-stopped
   ports:
     - "6379:6379"
   networks:
     - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

# ---------------- NETWORK ---------------- #
networks:
  app-network:

# ---------------- VOLUMES ---------------- #
volumes:
  patron_data:
