services:
  # ---------------- API GATEWAY ---------------- #
  api-gateway:
    build: ./node-api-gateway
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=384"
      auth: http://authentication-service:3002
      institute: http://institute-service:3004
      telecalling: http://telecalling-service:3006
      training: http://training-service:3008
      reception: http://reception-service:3013
      openvidu: http://openvidu-service:3017
      notify: http://notifyandlogs:3010
      ticket: http://ticket-service:3018
      content: http://content-service:3016
      payment: http://payment-service:3021
      placement: http://placement-service:3020
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network

  # ---------------- AUTHENTICATION SERVICE ---------------- #
  authentication-service:
    build: ./services/authentication
    ports:
      - "3002:3002"
      - "3001:3001"
    restart: unless-stopped
    environment:
      PORT: 3002
      PORT_GRPC: 3001
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: auth
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
      - rabbitmq
    networks:
      - app-network

  # ---------------- INSTITUTE SERVICE ---------------- #
  institute-service:
    build: ./services/institute
    ports:
      - "3004:3004"
      - "3003:3003"
    restart: unless-stopped
    environment:
      PORT: 3004
      PORT_GRPC: 3003
      AUTH_GRPC: authentication-service:3001
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: institute
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
      - rabbitmq
    networks:
      - app-network

  # ---------------- TELECALLING SERVICE ---------------- #
  telecalling-service:
    build: ./services/telecalling
    ports:
      - "3006:3006"
    restart: unless-stopped
    environment:
      PORT: 3006
      AUTH_GRPC: authentication-service:3001
      PAY_GRPC: payment-service:3011
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: telecalling
      DB_USER: root
      DB_PASS: root
      REDIS_HOST: redis
      KAFKA_BROKER: kafka:9092
    depends_on:
      - redis
      - rabbitmq
      - api-gateway
    networks:
      - app-network

  # ---------------- TRAINING SERVICE ---------------- #
  training-service:
    build: ./services/training
    ports:
      - "3008:3008"
    restart: unless-stopped
    environment:
      PORT: 3008
      AUTH_GRPC: authentication-service:3001
      INSTITUTE_GRPC: institute-service:3003
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: training
      DB_USER: root
      DB_PASS: root
      REDIS_HOST: redis
      KAFKA_BROKER: kafka:9092
    depends_on:
      - redis
      - api-gateway
      - institute-service
    networks:
      - app-network

  # ---------------- PAYMENT SERVICE ---------------- #
  payment-service:
    build: ./services/payment
    ports:
      - "3011:3011"
      - "3021:3021"
    restart: unless-stopped
    env_file:
      - ./services/payment/.env
    environment:
      GRPC_PORT: 3011
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: payment
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ---------------- RECEPTION SERVICE ---------------- #
  reception-service:
    build: ./services/reception
    ports:
      - "3013:3013"
    restart: unless-stopped
    environment:
      PORT: 3013
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: reception
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ---------------- MAIL SERVICE ---------------- #
  mail-service:
    build: ./services/mailservice
    ports:
      - "3012:3012"
    restart: unless-stopped
    env_file:
      - ./services/mailservice/.env
    environment:
      sender_mail: "mugilane.yoho@gmail.com"
      sender_password: "rgbx bvuw mxqj rqll"
      NODE_OPTIONS: "--max-old-space-size=384"
      KAFKA_BROKER: kafka:9092
    depends_on:
      - rabbitmq
    networks:
      - app-network

  # ---------------- NOTIFY AND LOGS SERVICE ---------------- #
  notifyandlogs:
    build: ./services/notifiyandlogs
    ports:
      - "3010:3010"
    restart: unless-stopped
    environment:
      PORT: 3010
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: notifyandlog
      DB_USER: root
      DB_PASS: root
      KAFKA_BROKER: kafka:9092
    depends_on:
      - api-gateway
      - rabbitmq
    networks:
      - app-network

  # ---------------- OPENVIDU API SERVICE ---------------- #
  openvidu-service:
    build: ./services/openvidu
    ports:
      - "3017:3017"
    restart: unless-stopped
    env_file:
      - ./services/openvidu/.env
    environment:
      PORT: 3017
      OPENVIDU_URL: http://videoconfrence:4443
      OPENVIDU_SECRET: MY_SECRET
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: openvidu
      DB_USER: root
      DB_PASS: root
      KAFKA_BROKER: kafka:9092
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ---------------- CONTENT SERVICE ---------------- #
  content-service:
    build: ./services/contentservice
    ports:
      - "3016:3016"
    restart: unless-stopped
    environment:
      PORT: 3016
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: content
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ---------------- TICKET SERVICE ---------------- #
  ticket-service:
    build: ./services/ticket-system
    ports:
      - "3018:3018"
    restart: unless-stopped
    environment:
      PORT: 3018
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: ticket
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
    networks:
      - app-network

  placement-service:
    build: ./services/placement
    ports:
      - "3020:3020"
    restart: unless-stopped
    environment:
      PORT: 3020
      PORT_GRPC: 3001
      NODE_OPTIONS: "--max-old-space-size=384"
      DB_HOST: patron
      DB_PORT: 3306
      DB_NAME: auth
      DB_USER: root
      DB_PASS: root
    depends_on:
      - api-gateway
    networks:
      - app-network


  # ---------------- DATABASES ---------------- #
  # patron:
  #   image: mysql:8.0
  #   restart: always
  #   container_name: patron
  #   ports:
  #     - "3306:3306"
