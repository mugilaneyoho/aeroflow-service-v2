  #     MYSQL_ROOT_PASSWORD: root
  #   volumes:
  #     - patron_data:/var/lib/mysql
  #     - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  #   networks:
  #     - app-network

  # ---------------- INFRA ---------------- #

  redis:
   image: redis:latest
   container_name: redis
   restart: unless-stopped
   ports:
     - "6379:6379"
   networks:
     - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

# ---------------- NETWORK ---------------- #
networks:
  app-network:

# ---------------- VOLUMES ---------------- #
volumes:
  patron_data:
